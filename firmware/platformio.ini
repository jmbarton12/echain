; eChain firmware: XIAO ePaper Display Board EE05 (XIAO ESP32-S3 Plus)
; + Seeed 2.9" BWRY 128x296 panel. See docs/REQUIREMENTS.md §12 for the pin map.

[platformio]
default_envs = ee05

[env:ee05]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; XIAO ESP32-S3 Plus: 16 MB flash, 8 MB OPI PSRAM (§10 item 4)
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Seeed_GFX2 is fetched (pinned commit, src/ only) by fetch_seeed_gfx2.py
; instead of lib_deps: its example paths break `git clone` on Windows.
extra_scripts =
    pre:scripts/fetch_seeed_gfx2.py
    pre:scripts/version.py
lib_extra_dirs = .pio/vendor

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
